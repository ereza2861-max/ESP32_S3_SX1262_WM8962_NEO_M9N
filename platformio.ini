[env:esp32-s3-wroom-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
extra_scripts =
    pre:tools/provision-web-tls.py
    pre:tools/provision-mqtt-ca.py
upload_speed = 921600
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16711680
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_cpu = 240000000L
board_build.partitions = no_ota.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I../shared
    -DBOARD_HAS_PSRAM
    -DFIELD_RADIO_ESP32_S3_WROOM_1_N16R8
    -DMYNEWT_VAL_BLE_MAX_CONNECTIONS=3
    -DMYNEWT_VAL_BLE_STORE_MAX_BONDS=8
    -DMYNEWT_VAL_BLE_STORE_MAX_CCCDS=8

; ---- PINNED DEPENDENCIES ----
lib_deps =
    jgromes/RadioLib@7.7.1
    mikalhart/TinyGPSPlus@1.0.2
    knolleary/PubSubClient@2.8
    adafruit/Adafruit NeoPixel@1.15.5
    h2zero/NimBLE-Arduino@2.5.1
    https://github.com/jackjansen/esp32_idf5_https_server_compat.git#master

[env:native]
platform = native
build_type = debug
test_framework = unity
test_build_project_src = yes
build_src_filter = -<*> +<BlePeerStore.cpp> +<EncryptedFrameParser.cpp>
build_flags =
    -Iinclude
    -Ishared
    -lcrypto


; ---- G17: ESP32-C3 sensor-node environment ----
[env:sensor_node_c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
src_dir = sensor_node_esp32c3/src
include_dir = sensor_node_esp32c3/include
build_flags =
    -Isensor_node_esp32c3/include
    -Ishared
    -DSENSOR_NODE_ESP32C3
; ---- PINNED DEPENDENCIES ----
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
