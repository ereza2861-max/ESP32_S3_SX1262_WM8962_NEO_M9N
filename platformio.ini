[env:esp32-s3-wroom-1]
platform = espressif32 @ 6.13.0
platform_packages =
    platformio/espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
extra_scripts =
    pre:tools/provision-web-tls.py
    pre:tools/provision-mqtt-ca.py
upload_speed = 921600
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16711680
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_cpu = 240000000L
board_build.partitions = no_ota.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I../shared
    -DBOARD_HAS_PSRAM
    -DFIELD_RADIO_ESP32_S3_WROOM_1_N16R8
    -DMYNEWT_VAL_BLE_MAX_CONNECTIONS=3
    -DMYNEWT_VAL_BLE_STORE_MAX_BONDS=8
    -DMYNEWT_VAL_BLE_STORE_MAX_CCCDS=8

; ---- PINNED DEPENDENCIES ----
lib_deps =
    ; pin: existing compatible range retained
    jgromes/RadioLib@^7.7.1
    ; audit: version not pinned
    mikalhart/TinyGPSPlus
    ; pin: existing compatible range retained
    knolleary/PubSubClient@^2.8
    ; audit: version not pinned
    adafruit/Adafruit NeoPixel
    ; pin: existing compatible range retained
    h2zero/NimBLE-Arduino@^2.5.1
    ; audit: git dependency has no immutable tag/commit
    https://github.com/jackjansen/esp32_idf5_https_server_compat.git

[env:native]
platform = native
build_type = debug
test_framework = unity
test_build_project_src = no
build_src_filter = -<*>


; ---- G17: ESP32-C3 sensor-node environment ----
[env:sensor_node_c3]
platform = espressif32 @ 6.13.0
platform_packages =
    platformio/espressif32 @ 6.13.0
board = esp32-c3-devkitm-1
framework = arduino
src_dir = sensor_node_esp32c3/src
include_dir = sensor_node_esp32c3/include
build_flags =
    -Isensor_node_esp32c3/include
    -Ishared
    -DSENSOR_NODE_ESP32C3
; ---- PINNED DEPENDENCIES ----
lib_deps =
    ; pin: existing compatible range retained
    h2zero/NimBLE-Arduino@^2.5.1
    ; audit: versions not pinned
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.15
