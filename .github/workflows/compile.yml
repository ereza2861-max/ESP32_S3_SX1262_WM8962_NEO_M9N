name: ESP32-S3 PlatformIO Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-S3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'sdkconfig.defaults', 'src/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Show PlatformIO information
        run: pio system info

      - name: Validate PlatformIO configuration
        run: pio project config

      - name: Run repository preflight
        run: make preflight

      - name: Verify generated files are ignored
        shell: bash
        run: |
          set -euo pipefail

          for path in .pio/ sdkconfig sdkconfig.old; do
            if git check-ignore -q --no-index "$path"; then
              echo "OK: $path is ignored"
            else
              echo "ERROR: $path is not ignored"
              exit 1
            fi
          done

      - name: Verify local credential file is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e include/LocalConfig.h

      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -o pipefail
          make ci-build 2>&1 | tee build.log

      - name: Collect CI diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo
            echo "=== PlatformIO version ==="
            pio --version || true
            echo
            echo "=== PlatformIO system info ==="
            pio system info || true
            echo
            echo "=== Git status ==="
            git status --short || true
          } > ci-context.txt

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-build-log-${{ github.sha }}
          path: |
            build.log
            ci-context.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect firmware artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          BUILD_DIR=".pio/build/esp32-s3-wroom-1"

          test -d "$BUILD_DIR"

          find "$BUILD_DIR" \
            -type f \
            \( \
              -name 'firmware.bin' \
              -o -name 'bootloader.bin' \
              -o -name 'partitions.bin' \
              -o -name 'boot_app0.bin' \
              -o -name 'firmware.elf' \
              -o -name 'firmware.map' \
            \) \
            -print \
            -exec cp {} artifacts/ \;

          echo "=== Firmware artifacts ==="
          find artifacts -type f -print

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
