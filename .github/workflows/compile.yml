name: ESP32-S3 PlatformIO Build

# CI is diagnostic-first: always retain logs, then fail the job at the final quality gate.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-S3
    env:
      CI: "true"
      PLATFORMIO_CORE_DIR: ~/.platformio
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          enableCrossOsArchive: false
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'sensor_node_esp32c3/platformio.ini', 'sdkconfig.defaults', 'src/idf_component.yml', 'shared/SensorProtocol.h') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Show PlatformIO information
        run: pio system info

      - name: Validate PlatformIO configuration
        run: pio project config

      - name: Check C3 partition size
        id: partition_check
        continue-on-error: true
        run: python3 tools/check_partition_size.py sensor_node_esp32c3/partitions.csv

      - name: Check configuration ownership
        id: config_ownership
        continue-on-error: true
        run: python3 tools/check_gconfig_direct.py

      - name: Run repository preflight
        id: repository_preflight
        continue-on-error: true
        run: make preflight

      - name: Verify generated files are ignored
        id: generated_files
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          for path in .pio/ sdkconfig sdkconfig.old include/generated/WebTlsProvisioning.h; do
            if git check-ignore -q --no-index "$path"; then
              echo "OK: $path is ignored"
            else
              echo "ERROR: $path is not ignored"
              exit 1
            fi
          done

      - name: Verify local credential file is absent
        id: local_credentials
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test ! -e include/LocalConfig.h

      - name: Run cppcheck S3 static analysis
        id: cppcheck_s3
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version
          cppcheck --enable=warning,performance,portability --inconclusive --error-exitcode=1 \
            --std=c++17 --language=c++ --suppress=missingIncludeSystem \
            -I include src

      - name: Run cppcheck C3 static analysis
        id: cppcheck_c3
        continue-on-error: true
        shell: bash
        working-directory: sensor_node_esp32c3
        run: |
          set -euo pipefail
          cppcheck --enable=warning,performance,portability --inconclusive --error-exitcode=1 \
            --std=c++17 --language=c++ --suppress=missingIncludeSystem \
            -I include -I src -I ../shared src

      - name: Run native S3 tests
        id: native_s3
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pio test -e native 2>&1 | tee native-test.log

      - name: Run C3 native profile tests
        id: native_c3_profile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd sensor_node_esp32c3
          pio test -e native_test_profile 2>&1 | tee ../native-test-profile.log

      - name: Run C3 native registry tests
        id: native_c3_registry
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd sensor_node_esp32c3
          pio test -e native_test_registry 2>&1 | tee ../native-test-registry.log

      - name: Build ESP32-S3 gateway firmware
        id: build_s3
        continue-on-error: true
        shell: bash
        run: |
          set -u
          : > build.log
          set +e
          pio run -e esp32s3 -v 2>&1 | tee -a build.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -ne 0 ] && \
             grep -Fq "Two environments with different actions were specified for the same target:" build.log; then
            echo "::warning::Detected duplicate USB UAC descriptor registration; applying a guarded local dependency workaround."
            python3 tools/fix_usb_uac_component.py
            echo "=== Retry after USB UAC component workaround ===" | tee -a build.log
            set +e
            pio run -e esp32s3 -v 2>&1 | tee -a build.log
            build_status=${PIPESTATUS[0]}
            set -e
          fi

          if [ "$build_status" -ne 0 ]; then
            echo "::error::ESP32-S3 build failed; inspect build.log for the first underlying error."
            exit "$build_status"
          fi

      - name: Build ESP32-C3 sensor-node firmware
        id: build_c3
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd sensor_node_esp32c3
          pio run -e sensor_node_esp32c3 2>&1 | tee ../sensor-node-build.log

      - name: Collect CI diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workspace=${GITHUB_WORKSPACE}"
            echo "runner_temp=${RUNNER_TEMP}"
            echo "python=${pythonLocation:-unknown}"
            echo
            echo "=== PlatformIO version ==="
            pio --version || true
            echo
            echo "=== PlatformIO system info ==="
            pio system info || true
            echo
            echo "=== Git status ==="
            git status --short || true
          } > ci-context.txt

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-build-log-${{ github.sha }}
          path: |
            build.log
            native-test.log
            native-test-profile.log
            native-test-registry.log
            sensor-node-build.log
            ci-context.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Collect firmware artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          BUILD_DIR=".pio/build/esp32s3"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "No S3 build directory; compile may have failed before producing firmware."
            exit 0
          fi

          find "$BUILD_DIR" \
            -type f \
            \( \
              -name 'firmware.bin' \
              -o -name 'bootloader.bin' \
              -o -name 'partitions.bin' \
              -o -name 'boot_app0.bin' \
              -o -name 'firmware.elf' \
              -o -name 'firmware.map' \
            \) \
            -print \
            -exec cp {} artifacts/ \;

          echo "=== Firmware artifacts ==="
          find artifacts -type f -print

      - name: Collect sensor-node firmware artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="sensor_node_esp32c3/.pio/build/sensor_node_esp32c3"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "No C3 build directory; compile may have failed before producing firmware."
            exit 0
          fi
          mkdir -p sensor-node-artifacts

          find "$BUILD_DIR" \
            -type f \
            \( \
              -name 'firmware.bin' \
              -o -name 'bootloader.bin' \
              -o -name 'partitions.bin' \
              -o -name 'firmware.elf' \
              -o -name 'firmware.map' \
            \) \
            -print \
            -exec cp {} sensor-node-artifacts/ \;

          find sensor-node-artifacts -type f -print

      - name: Upload sensor-node firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-sensor-node-${{ github.sha }}
          path: sensor-node-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      # Keep source-policy and test failures visible, but only after the
      # compiler logs and any partial artifacts have been uploaded.
      - name: Enforce non-build quality gates
        if: always()
        shell: bash
        env:
          PARTITION_CHECK: ${{ steps.partition_check.outcome }}
          CONFIG_OWNERSHIP: ${{ steps.config_ownership.outcome }}
          REPOSITORY_PREFLIGHT: ${{ steps.repository_preflight.outcome }}
          GENERATED_FILES: ${{ steps.generated_files.outcome }}
          LOCAL_CREDENTIALS: ${{ steps.local_credentials.outcome }}
          CPPCHECK_S3: ${{ steps.cppcheck_s3.outcome }}
          CPPCHECK_C3: ${{ steps.cppcheck_c3.outcome }}
          NATIVE_S3: ${{ steps.native_s3.outcome }}
          BUILD_S3: ${{ steps.build_s3.outcome }}
          BUILD_C3: ${{ steps.build_c3.outcome }}
          NATIVE_C3_PROFILE: ${{ steps.native_c3_profile.outcome }}
          NATIVE_C3_REGISTRY: ${{ steps.native_c3_registry.outcome }}
        run: |
          set -u
          failed=0
          for gate in \
            PARTITION_CHECK CONFIG_OWNERSHIP REPOSITORY_PREFLIGHT \
            GENERATED_FILES LOCAL_CREDENTIALS CPPCHECK_S3 CPPCHECK_C3 \
            NATIVE_S3 NATIVE_C3_PROFILE NATIVE_C3_REGISTRY; do
            value="${!gate}"
            if [ "$value" != "success" ]; then
              echo "::error::$gate did not pass (outcome: $value)"
              failed=1
            fi
          done
          exit "$failed"
