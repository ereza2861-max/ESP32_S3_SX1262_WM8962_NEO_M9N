[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
build_flags =
    -I../shared
    -DSENSOR_NODE_ESP32C3
; ---- PINNED DEPENDENCIES ----
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
    miguelbalboa/MFRC522@1.4.11
    adafruit/Adafruit VEML6075 Library@1.0.0
    adafruit/Adafruit MAX31865 library@1.6.0
    sensirion/Sensirion I2C SCD4x@1.0.0
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0


[env:native_test_profile]
platform = native
test_framework = custom
test_filter =
    test_profile_manager
    test_placeholder_gating
    test_command_replay_semantics
    test_ble_command_key_uniqueness
    test_onewire_rom_identity
    test_ota_password_hash
    test_ota_request_signing
build_flags =
    -Iinclude
    -Isrc
    -I../shared
    -std=gnu++17
    -lcrypto
build_src_filter =
    +<../test/test_profile_manager/>

[env:native_test_registry]
platform = native
test_framework = custom
test_filter =
    test_sensor_registry
    test_rfid_event_sequence
    test_sampling_period_persistence
build_flags =
    -Iinclude
    -Isrc
    -I../shared
    -std=gnu++17
    -DUNIT_TEST=1
build_src_filter =
    +<../test/test_sensor_registry/>
    +<../src/SensorRegistry.cpp>
    -<../src/main.cpp>
    -<../src/BleSensorServer.cpp>
    -<../src/SensorDriverRegistry.cpp>
    -<../src/ProfileManager.cpp>
    -<../src/ProfileSensors.cpp>
    -<../src/RfidReader.cpp>
    -<../src/sensors_example.cpp>
    -<../src/OtaApManager.cpp>

[env:sensor_node_esp32c3]
extends = env:esp32-c3-devkitm-1
